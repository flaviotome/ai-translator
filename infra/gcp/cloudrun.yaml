apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ai-translator-backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 30
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/ai-translator/backend:latest
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
          env:
            - name: LLM_PROVIDER
              value: gemini
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: latest
