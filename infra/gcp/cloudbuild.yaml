steps:
  - name: 'python:3.11-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        pip install -r backend/requirements.txt pytest httpx &&
        cd backend && pytest tests/ -v

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-translator/backend:${SHORT_SHA}'
      - -t
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-translator/backend:latest'
      - -f
      - infra/docker/Dockerfile
      - backend/

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-translator/backend'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - run
      - deploy
      - ai-translator-backend
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-translator/backend:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated

substitutions:
  _REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY
