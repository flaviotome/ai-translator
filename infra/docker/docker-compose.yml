version: '3.9'

services:
  backend:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/Dockerfile
    ports:
      - "8001:8080"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ../../backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload
