name: Deploy Backend to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "infra/docker/Dockerfile"
      - "infra/docker/.dockerignore"

env:
  REGION: ${{ secrets.GCP_REGION }}
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE: ai-translator-backend
  IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ai-translator/backend

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Run backend tests
        run: |
          python -m pip install -r requirements.txt pytest httpx
          python -m pytest tests/ -v
        working-directory: backend
        env:
          GEMINI_API_KEY: dummy-key-for-tests
          LLM_PROVIDER: gemini

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            -f infra/docker/Dockerfile \
            backend/

      - name: Push to Artifact Registry
        run: docker push --all-tags ${{ env.IMAGE }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --service-account=ai-translator-deploy@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --set-secrets=GEMINI_API_KEY=gemini-api-key:latest \
            --set-env-vars=LLM_PROVIDER=gemini \
            --project=${{ env.PROJECT_ID }}

      - name: Print service URL
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(status.url)"
